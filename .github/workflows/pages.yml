name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check for published content changes
        id: content
        run: node scripts/cms-revision.mjs
      - uses: actions/configure-pages@v5
        if: steps.content.outputs.changed == 'true'
      - run: npm ci
        if: steps.content.outputs.changed == 'true'
      - run: npm run lint && npm test && npm run build
        if: steps.content.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: /Emman-personal-portfolio
          SITE_URL: https://Jemp72.github.io
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
          NEXT_PUBLIC_SANITY_STUDIO_URL: https://emman-portfolio-8cs195in.sanity.studio
      - uses: actions/upload-pages-artifact@v3
        if: steps.content.outputs.changed == 'true'
        with:
          path: out
      - uses: actions/deploy-pages@v4
        if: steps.content.outputs.changed == 'true'
        id: deployment
