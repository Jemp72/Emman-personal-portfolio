media:
  - name: images
    label: Images
    input: public/cms-media
    output: /cms-media
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - gif
      - svg
      - ico
      - avif
    rename: safe
  - name: documents
    label: Documents
    input: public/cms-media
    output: /cms-media
    extensions:
      - pdf
      - png
      - jpg
      - jpeg
      - webp
    rename: safe
content:
  - name: portfolio
    label: Portfolio content
    type: file
    path: src/content/portfolio.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: headline
        label: Headline
        type: text
        required: true
      - name: intro
        label: Intro
        type: text
        required: true
      - name: bio
        label: Bio
        type: text
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: educationEntries
        label: Education Entries
        type: string
        list: true
      - name: resume
        label: Resume
        type: file
        options:
          media: documents
      - name: portrait
        label: Portrait
        type: object
        fields:
          - name: url
            label: Url
            type: image
            options:
              media: images
          - name: alt
            label: Alt
            type: string
      - name: logo
        label: Logo
        type: image
        options:
          media: images
      - name: favicon
        label: Favicon
        type: image
        options:
          media: images
      - name: socials
        label: Socials
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Url
            type: string
            required: true
          - name: logo
            label: Logo
            type: image
            options:
              media: images
      - name: skills
        label: Skills
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category}"
        fields:
          - name: category
            label: Category
            type: string
            required: true
          - name: items
            label: Items
            type: string
            list: true
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: slug
            label: Slug
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: summary
            label: Summary
            type: text
            required: true
          - name: body
            label: Body
            type: text
            required: true
          - name: technologies
            label: Technologies
            type: string
            list: true
          - name: images
            label: Images
            type: image
            options:
              media: images
              multiple:
                max: 30
          - name: source
            label: Source
            type: string
          - name: demo
            label: Demo
            type: string
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: category
            label: Category
            type: string
            required: true
          - name: image
            label: Image
            type: image
            options:
              media: images
          - name: alt
            label: Alt
            type: string
          - name: description
            label: Description
            type: text
      - name: certifications
        label: Certifications
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: issuer
            label: Issuer
            type: string
            required: true
          - name: issuedOn
            label: Issued On
            type: date
          - name: credentialType
            label: Credential Type
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: Url
            type: file
            options:
              media: documents
          - name: externalUrl
            label: External Url
            type: string
